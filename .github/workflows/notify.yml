name: Daily D-day Digest

on:
  schedule:
    # 매일 KST 08:30(UTC 전날 23:30)에 실행. cron은 UTC 기준이다.
    # collect.yml(KST 08:00 수집)과 deploy.yml(KST 09:00 재배포) 사이에 걸어, 그날 새로
    # 수집된 공고가 다이제스트에 반영되게 한다.
    - cron: '30 23 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: notify-digest
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 웹훅 시크릿이 하나도 설정 안 된 레포(아직 설정 전)에서는 이후 스텝을 전부 건너뛴다.
      # 매일 실패 알림이 오면 안 되므로 워크플로 자체는 성공으로 끝내되, 로그에는 왜
      # 건너뛰었는지 남긴다.
      - name: Check webhook secrets configured
        id: secrets-check
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ] && [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::SLACK_WEBHOOK_URL / DISCORD_WEBHOOK_URL이 모두 설정되지 않아 다이제스트 전송을 건너뜁니다. README.md '알림' 절을 참고해 웹훅을 등록하세요."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node
        if: steps.secrets-check.outputs.configured == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        if: steps.secrets-check.outputs.configured == 'true'
        run: npm ci

      - name: Send daily digest
        if: steps.secrets-check.outputs.configured == 'true'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        # ::add-mask::로 웹훅 URL을 로그 마스킹 대상에 명시적으로 등록한다.
        # (notify.mjs 자체도 실패 응답 로그에 URL을 남기지 않지만, 이 레포는 public이고
        # Actions 로그도 공개이므로 이중 안전장치를 둔다.)
        run: |
          if [ -n "$SLACK_WEBHOOK_URL" ]; then echo "::add-mask::$SLACK_WEBHOOK_URL"; fi
          if [ -n "$DISCORD_WEBHOOK_URL" ]; then echo "::add-mask::$DISCORD_WEBHOOK_URL"; fi
          node scripts/notify.mjs
