name: Collect Announcements (K-Startup + 기업마당)

on:
  schedule:
    # 매일 KST 08:00(UTC 전날 23:00)에 실행. cron은 UTC 기준이다.
    - cron: '0 23 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect-kstartup
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run collector
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          # BIZINFO_CRTFC_KEY(기업마당 서비스키)는 선택 사항이다 — 레포에 시크릿이
          # 설정되지 않으면 빈 문자열이 되고, scripts/collect.mjs가 기업마당 수집만
          # 건너뛰고 K-Startup은 정상 진행한다(워크플로를 실패시키지 않는다).
          BIZINFO_CRTFC_KEY: ${{ secrets.BIZINFO_CRTFC_KEY }}
        # ::add-mask::로 서비스키를 로그 마스킹 대상에 명시적으로 등록한다.
        # (수집 스크립트 자체도 URL 로그에 키를 남기지 않지만, 이중 안전장치)
        # BIZINFO_CRTFC_KEY가 비어 있을 때 add-mask에 빈 문자열을 등록하면 GitHub Actions가
        # 경고를 남기므로, 값이 있을 때만 마스킹 대상으로 등록한다.
        run: |
          echo "::add-mask::$DATA_GO_KR_KEY"
          if [ -n "$BIZINFO_CRTFC_KEY" ]; then
            echo "::add-mask::$BIZINFO_CRTFC_KEY"
          fi
          node scripts/collect.mjs

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet -- data/programs.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate collected data against schema
        if: steps.diff.outputs.changed == 'true'
        run: npm run build

      - name: Commit and push
        if: steps.diff.outputs.changed == 'true'
        # 체크아웃~푸시 사이에 사람이 main에 커밋하면 push가 non-fast-forward로 거부된다.
        # rebase --autostash로 최신 main 위에 우리 커밋을 얹어 재시도한다.
        # rebase 자체가 충돌하면(같은 파일을 동시에 건드린 경우) 조용히 넘어가지 않고
        # 스텝을 실패시켜 사람이 보게 한다 — 그날 수집분을 자동으로 버리지 않는다.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/programs.json
          git commit -m "chore(data): 공고 자동수집 갱신 (K-Startup/기업마당) ($(date -u +%Y-%m-%dT%H:%M:%SZ))"

          attempt=1
          max_attempts=5
          until git push; do
            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "::error::push가 ${max_attempts}회 시도 후에도 실패했습니다. 사람이 확인해야 합니다."
              exit 1
            fi
            echo "push 실패(non-fast-forward로 추정) — origin/main을 rebase 후 재시도합니다. (시도 $attempt/$max_attempts)"
            if ! git pull --rebase --autostash origin main; then
              echo "::error::rebase 충돌이 발생했습니다. 자동 해결하지 않고 실패시킵니다 — 사람이 확인해야 합니다."
              git rebase --abort || true
              exit 1
            fi
            attempt=$((attempt + 1))
          done
