name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # 정적 사이트라 D-day/마감상태/서류만료 판정이 빌드 시점 값으로 HTML에 고정된다.
    # collect.yml이 변경분 없는 날엔 커밋을 안 하므로, 재빌드가 없으면 D-day가 며칠씩 낡는다.
    # 그래서 매일 강제로 재빌드·재배포한다 (내용 변경 여부와 무관하게).
    #
    # cron은 UTC 기준. KST 09:00 = UTC 00:00 (같은 날짜).
    # collect.yml은 KST 08:00(UTC 전날 23:00)에 먼저 돌아 신규 공고를 커밋하므로,
    # 이 스케줄은 그 1시간 뒤로 잡아 수집 커밋이 반영된 뒤 재빌드되게 한다.
    - cron: '0 0 * * *'
    # 위 스케줄 하나만 있으면 KST 자정(00:00)부터 09:00까지 9시간 동안 '어제 빌드본'이 그대로 서빙되어
    # D-day가 하루 밀려 보인다(예: 9/15 새벽에 9/15 마감 공고가 D-1로, 이미 마감된 9/14 공고가
    # 여전히 urgent 배지로 남는 사례가 실측됨). 그래서 KST 자정 직후에도 한 번 더 강제 재빌드한다.
    # ⚠️ 이 스케줄을 "위와 중복"이라 보고 지우지 말 것 — 날짜가 바뀌는 순간을 커버하는 게 목적이다.
    #
    # cron은 UTC 기준. KST 00:00 = UTC 15:00 (전날 날짜).
    - cron: '0 15 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
